<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceMatch - Identifier une voix de doubleur</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <!-- Main screen: Shazam-like -->
        <div id="screen-main" class="screen active">
            <header>
                <h1>VoiceMatch</h1>
                <p class="subtitle">Identifiez les voix des doubleurs</p>
            </header>

            <div class="listen-area">
                <div class="btn-listen-wrapper">
                    <button id="btn-listen" class="btn-listen" type="button" aria-label="Ecouter">
                        <svg class="mic-icon" viewBox="0 0 24 24" width="48" height="48" fill="none">
                            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" fill="currentColor"/>
                            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" fill="currentColor"/>
                        </svg>
                    </button>
                    <div class="pulse-ring ring-1"></div>
                    <div class="pulse-ring ring-2"></div>
                </div>

                <p id="listen-label" class="listen-label">Appuyez pour identifier une voix</p>

                <div id="waveform-container" class="waveform-container hidden">
                    <canvas id="canvas-waveform" width="300" height="60"></canvas>
                </div>
            </div>

            <div class="bottom-section">
                <div class="upload-alt">
                    <label for="input-file-match" class="link-upload">
                        ou uploader un fichier audio
                    </label>
                    <input type="file" id="input-file-match" accept="audio/*" class="sr-only" />
                </div>

                <div class="stats-bar">
                    <span id="stat-actors">{{ stats.actors }}</span> doubleurs &bull;
                    <span id="stat-samples">{{ stats.voice_samples }}</span> echantillons
                </div>
            </div>
        </div>

        <!-- Results screen -->
        <div id="screen-results" class="screen">
            <button id="btn-back" class="btn-back" type="button" aria-label="Retour">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="currentColor"/>
                </svg>
                Nouvelle identification
            </button>

            <div id="results-container"></div>
        </div>

        <!-- Loading overlay -->
        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p id="loading-text">Analyse en cours...</p>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
