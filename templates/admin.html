<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceMatch - Administration</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
    <link rel="stylesheet" href="/static/admin.css?v=3">
</head>
<body class="admin-body">
    <div class="admin-app">
        <!-- Login screen -->
        <div id="login-screen" class="admin-screen active">
            <div class="login-card">
                <h1 class="login-logo">VoiceMatch</h1>
                <p class="login-subtitle">Administration</p>
                <form id="form-login">
                    <input type="password" id="input-password" name="password"
                           placeholder="Mot de passe administrateur" required autocomplete="current-password" />
                    <button type="submit" class="btn btn-primary btn-block">Connexion</button>
                </form>
                <div id="login-error" class="alert alert-error hidden"></div>
                <a href="/" class="back-link">&larr; Retour au site</a>
            </div>
        </div>

        <!-- Dashboard screen -->
        <div id="dashboard-screen" class="admin-screen">
            <div class="admin-topbar">
                <h2 class="admin-title">VoiceMatch Admin</h2>
                <div class="admin-topbar-right">
                    <a href="/" class="btn btn-outline btn-sm">Voir le site</a>
                    <button id="btn-logout" class="btn btn-outline btn-sm">Deconnexion</button>
                </div>
            </div>

            <div class="admin-content">
                <div id="password-warning" class="alert alert-warning hidden">
                    Vous utilisez le mot de passe par defaut. Changez-le ci-dessous.
                </div>

                <div class="admin-stats">
                    <div class="stat-card">
                        <div class="stat-value" id="admin-stat-actors">0</div>
                        <div class="stat-label">Doubleurs</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="admin-stat-samples">0</div>
                        <div class="stat-label">Echantillons</div>
                    </div>
                </div>

                <div class="card">
                    <h3 class="card-title">Ajouter une voix</h3>
                    <form id="form-upload" enctype="multipart/form-data">
                        <div class="form-group">
                            <label for="input-mp3">Fichier MP3</label>
                            <input type="file" id="input-mp3" name="file" accept=".mp3,audio/mpeg" required />
                        </div>
                        <div class="form-group">
                            <label for="input-dubber">Nom du doubleur</label>
                            <input type="text" id="input-dubber" name="dubber_name"
                                   placeholder="ex: Emmanuel Curtil" required />
                        </div>
                        <button type="submit" class="btn btn-primary">Ajouter a la base</button>
                    </form>
                    <div id="upload-result" class="hidden"></div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h3 class="card-title">Base de donnees</h3>
                        <button id="btn-refresh" class="btn btn-outline btn-sm">Actualiser</button>
                    </div>
                    <div id="actors-list" class="actors-list">
                        <p class="empty-msg">Chargement...</p>
                    </div>
                </div>

                <div class="card">
                    <h3 class="card-title">Changer le mot de passe</h3>
                    <form id="form-password">
                        <div class="form-group">
                            <label for="input-current-pw">Mot de passe actuel</label>
                            <input type="password" id="input-current-pw" name="current_password"
                                   required autocomplete="current-password" />
                        </div>
                        <div class="form-group">
                            <label for="input-new-pw">Nouveau mot de passe (min. 6 caracteres)</label>
                            <input type="password" id="input-new-pw" name="new_password"
                                   required minlength="6" autocomplete="new-password" />
                        </div>
                        <button type="submit" class="btn btn-primary">Modifier</button>
                    </form>
                    <div id="password-result" class="hidden"></div>
                </div>
            </div>
        </div>

        <!-- Loading overlay -->
        <div id="admin-loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Chargement...</p>
        </div>
    </div>

    <script src="/static/admin.js?v=3"></script>
</body>
</html>
